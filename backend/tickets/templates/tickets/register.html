{% extends 'tickets/base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-200">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Create Account</h2>
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div class="flex flex-col space-y-2">
            {{ form.as_p }}
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition shadow-md">
            Register System User
        </button>
    </form>
</div>
{% endblock %}
