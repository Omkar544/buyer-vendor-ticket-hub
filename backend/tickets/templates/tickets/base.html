<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketHub | Admin & Foundation</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <nav class="bg-slate-800 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight">TicketHub <span class="text-blue-400">Pro</span></h1>
            <div class="space-x-6">
                {% if user.is_authenticated %}
                    <span class="text-sm text-slate-300">Logged in as: <strong>{{ user.username }}</strong></span>
                    <a href="{% url 'logout' %}" class="hover:text-red-400 transition">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="hover:text-blue-300 transition">Login</a>
                    <a href="{% url 'register' %}" class="bg-blue-600 px-4 py-2 rounded-lg hover:bg-blue-700 transition">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container mx-auto mt-10 p-4 flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t p-6 mt-12 text-center text-gray-500 text-sm">
        &copy; 2026 Ticket Management System | Built with Django & React
    </footer>
</body>
</html>
