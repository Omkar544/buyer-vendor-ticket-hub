{% extends 'tickets/base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-2xl shadow-xl border border-gray-100 animate-in fade-in slide-in-from-bottom-4 duration-500">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-black text-slate-900 tracking-tight">User Login</h2>
        <p class="text-sm text-slate-500 mt-2">Access the TicketHub system dashboard.</p>
    </div>

    <form method="POST" class="space-y-6">
        {% csrf_token %}
        
        <div class="space-y-4">
            {% for field in form %}
                <div class="flex flex-col gap-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">{{ field.label }}</label>
                    <div class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus-within:ring-2 focus-within:ring-blue-500 transition-all">
                        {{ field }}
                    </div>
                    {% if field.errors %}
                        <p class="text-xs text-red-500 mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}
        </div>

        <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-blue-600 transition-all shadow-lg active:scale-95 uppercase text-xs tracking-widest">
            Sign In
        </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-100 text-center">
        <p class="text-sm text-slate-500">
            Don't have an account? 
            <a href="{% url 'register' %}" class="text-blue-600 font-bold hover:underline">Register here</a>
        </p>
    </div>
</div>

<style>
    /* Injects modern styling into the default Django form inputs */
    form p input {
        width: 100%;
        background: transparent;
        outline: none;
        font-size: 14px;
        color: #1e293b;
    }
</style>
{% endblock %}
