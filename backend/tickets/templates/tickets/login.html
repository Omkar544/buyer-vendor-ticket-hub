{% extends 'tickets/base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-200">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">User Login</h2>
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <p class="text-sm text-gray-500 mb-4">Access the TicketHub system dashboard.</p>
        {{ form.as_p }}
        <button type="submit" class="w-full bg-slate-800 text-white py-3 rounded-lg font-semibold hover:bg-slate-900 transition shadow-md">
            Sign In
        </button>
    </form>
</div>
{% endblock %}
